services:
  gateway:
    build:
      context: ..
      dockerfile: scanner/Dockerfile
    restart: unless-stopped
    environment:
      SCANNER_BEARER_SECRET: ${SCANNER_BEARER_SECRET:?Set a unique secret of at least 32 characters}
      CLAMD_HOST: clamav
      CLAMD_PORT: "3310"
      PORT: "8080"
    depends_on:
      clamav:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
    networks:
      - scanner_internal
  clamav:
    image: clamav/clamav:stable
    restart: unless-stopped
    volumes:
      - clamav_signatures:/var/lib/clamav
    healthcheck:
      test: ["CMD", "clamdscan", "--version"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 180s
    networks:
      - scanner_internal
networks:
  scanner_internal:
    driver: bridge
volumes:
  clamav_signatures:
