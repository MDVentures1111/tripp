name: D04 Document Security CI
on:
  push:
    branches: [d04-b2-backend-foundation]
    paths:
      - 'supabase/**'
      - '.github/workflows/d04-document-security.yml'
  pull_request:
    paths:
      - 'supabase/**'
      - '.github/workflows/d04-document-security.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: d04-document-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deno-unit:
    name: Deno document validation and security unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Run tests
        run: deno test --node-modules-dir=auto --allow-env supabase/functions/tests/documents_test.ts supabase/functions/tests/file_validation_test.ts supabase/functions/tests/reconciler_transport_test.ts supabase/functions/tests/pdf_active_content_test.ts supabase/functions/tests/malware_scanner_test.ts

  local-supabase:
    name: Local Supabase migration smoke check
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v3.0.1
        with:
          version: 2.120.0
      - name: Verify CLI availability
        run: supabase --version
      - name: Check local stack prerequisites
        run: docker --version
      - name: Prepare CI-only schema prerequisites
        run: |
          mkdir -p supabase/migrations
          cp supabase/ci/bootstrap_organizations.sql supabase/migrations/20261009000000_ci_bootstrap_organizations.sql
      - name: Start isolated local Supabase stack
        run: supabase start --exclude studio,imgproxy,logflare,vector,supavisor
      - name: Show local stack status
        run: supabase status
      - name: Run database authorization and lifecycle integration tests
        run: |
          docker exec -i supabase_db_tripp psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/ci/document_integration.sql
      - name: Shut down isolated stack
        if: always()
        run: supabase stop --no-backup


  document-http-e2e:
    name: Isolated Storage and Edge Function HTTP end-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v3.0.1
        with:
          version: 2.120.0
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Prepare isolated schema prerequisites
        run: |
          cp supabase/ci/bootstrap_organizations.sql supabase/migrations/20261009000000_ci_bootstrap_organizations.sql
      - name: Start local Supabase
        run: supabase start --exclude studio,imgproxy,logflare,vector,supavisor
      - name: Start isolated mock scanner
        run: |
          nohup deno run --allow-net supabase/ci/mock_malware_scanner.ts > /tmp/tripp-mock-scanner.log 2>&1 &
          sleep 2
          if ! kill -0 $! 2>/dev/null; then cat /tmp/tripp-mock-scanner.log; exit 1; fi
      - name: Prepare local-only function configuration
        run: |
          supabase status -o env > /tmp/tripp-supabase-status.env
          set -a
          . /tmp/tripp-supabase-status.env
          set +a
          printf 'SUPABASE_URL=http://127.0.0.1:54321\nSUPABASE_ANON_KEY=%s\nSUPABASE_SERVICE_ROLE_KEY=%s\nTRIPP_ENABLE_DOCUMENT_UPLOADS=verified\nTRIPP_ENABLE_RECONCILER=verified\nTRIPP_RECONCILER_SECRET=tripp-ci-local-reconciler-secret-only-2026\nTRIPP_ALLOWED_ORIGINS=http://127.0.0.1:54321\nTRIPP_ENABLE_MALWARE_SCANNING=verified\nTRIPP_MALWARE_SCANNER_URL=http://host.docker.internal:8080/scan\nTRIPP_CI_SCANNER_FIXTURE=isolated\nTRIPP_MALWARE_SCANNER_SECRET=tripp-ci-scanner-secret-not-for-production-2026\n' "$ANON_KEY" "$SERVICE_ROLE_KEY" > /tmp/tripp-d04-e2e.env
          grep -qx "TRIPP_ENABLE_DOCUMENT_UPLOADS=verified" /tmp/tripp-d04-e2e.env
          echo "TRIPP_E2E_ANON_KEY=$ANON_KEY" >> "$GITHUB_ENV"
          echo "TRIPP_E2E_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY" >> "$GITHUB_ENV"
      - name: Serve isolated Edge Functions
        run: |
          nohup env TRIPP_ENABLE_DOCUMENT_UPLOADS=verified TRIPP_ENABLE_RECONCILER=verified TRIPP_RECONCILER_SECRET=tripp-ci-local-reconciler-secret-only-2026 supabase functions serve --no-verify-jwt --env-file /tmp/tripp-d04-e2e.env > /tmp/tripp-d04-functions.log 2>&1 &
          sleep 12
          if ! kill -0 $! 2>/dev/null; then cat /tmp/tripp-d04-functions.log; exit 1; fi
      - name: Run real HTTP Storage and Edge Function tests
        run: deno run --node-modules-dir=auto --allow-env --allow-net supabase/ci/d04_b3_e2e.ts
      - name: Print function diagnostics on failure
        if: failure()
        run: tail -100 /tmp/tripp-d04-functions.log || true
      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup
