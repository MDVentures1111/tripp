name: D04 Inspection SQL Ephemeral Verification
# CI-ONLY. Runs Q0/Q1/Q2 against a disposable local Supabase stack. No secrets, no project link,
# no production access. Raw query output stays on the runner and is deleted; only PASS/FAIL is logged.
on:
  push:
    branches: [d04-c-document-backend-mvp]
    paths:
      - 'supabase/inspection/**'
      - '.github/workflows/d04-inspection-verify.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: d04-inspection-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-inspection-sql:
    name: Verify Q0/Q1/Q2 on ephemeral local Supabase
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Verify inspection artifact checksums
        working-directory: supabase/inspection/d04c4
        run: sha256sum -c SHA256SUMS
      - name: Assert no production link or credentials
        run: |
          test ! -e supabase/.temp/project-ref
          for v in SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD SUPABASE_PROJECT_REF DATABASE_URL PGPASSWORD; do
            if [ -n "${!v:-}" ]; then echo "::error::$v is set"; exit 1; fi
          done
          if grep -rqn "ufcgsdpqfqeifjzzcuei" supabase/inspection/d04c4/ci; then echo "::error::production ref in CI fixtures"; exit 1; fi
      - uses: supabase/setup-cli@v3.0.1
        with:
          version: 2.120.0
      - name: Prepare CI-only schema prerequisites
        run: cp supabase/ci/bootstrap_organizations.sql supabase/migrations/20261009000000_ci_bootstrap_organizations.sql
      - name: Start isolated local Supabase stack
        run: supabase start --exclude studio,imgproxy,logflare,vector,supavisor
      - name: Run ephemeral inspection verification
        run: python3 supabase/inspection/d04c4/ci/verify.py
      - name: Shut down isolated stack
        if: always()
        run: supabase stop --no-backup

  runbook-execution-path:
    name: Runbook execution path (exact psql invocation, pty password prompt, failures, share builder)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Verify pinned artifact checksums
        working-directory: supabase/inspection/d04c4
        run: sha256sum -c SHA256SUMS
      - name: Assert no production link or credentials
        run: |
          test ! -e supabase/.temp/project-ref
          for v in SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD SUPABASE_PROJECT_REF DATABASE_URL PGPASSWORD; do
            if [ -n "${!v:-}" ]; then echo "::error::$v is set"; exit 1; fi
          done
          if grep -rqn "ufcgsdpqfqeifjzzcuei" supabase/inspection/d04c4/ci supabase/inspection/d04c4/operator; then echo "::error::production ref in CI/operator files"; exit 1; fi
      - name: Ensure host psql client
        run: psql --version || (sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client)
      - uses: supabase/setup-cli@v3.0.1
        with:
          version: 2.120.0
      - name: Prepare CI-only schema prerequisites and local session pooler (runner copy only)
        run: |
          cp supabase/ci/bootstrap_organizations.sql supabase/migrations/20261009000000_ci_bootstrap_organizations.sql
          printf '\n[db.pooler]\nenabled = true\nport = 54329\npool_mode = "session"\ndefault_pool_size = 20\nmax_client_conn = 100\n' >> supabase/config.toml
      - name: Start isolated local Supabase stack (with local pooler; falls back without it)
        run: |
          if ! supabase start --exclude studio,imgproxy,logflare,vector; then
            echo "::warning::local supavisor did not start; pooler path will be reported NOT REPRODUCED"
            supabase stop --no-backup || true
            supabase start --exclude studio,imgproxy,logflare,vector,supavisor
          fi
      - name: Run runbook execution-path verification
        run: python3 supabase/inspection/d04c4/ci/runbook_path.py
      - name: Shut down isolated stack
        if: always()
        run: supabase stop --no-backup

  sql-editor-path:
    name: SQL Editor package (single-submission, postgres-meta, Studio route, importer, share builder)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Verify pinned artifact checksums
        working-directory: supabase/inspection/d04c4
        run: sha256sum -c SHA256SUMS
      - name: Assert no production link or credentials
        run: |
          test ! -e supabase/.temp/project-ref
          for v in SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD SUPABASE_PROJECT_REF DATABASE_URL PGPASSWORD; do
            if [ -n "${!v:-}" ]; then echo "::error::$v is set"; exit 1; fi
          done
          if grep -rqn "ufcgsdpqfqeifjzzcuei" supabase/inspection/d04c4/ci supabase/inspection/d04c4/operator supabase/inspection/d04c4/editor; then echo "::error::production ref in CI/operator/editor files"; exit 1; fi
      - uses: supabase/setup-cli@v3.0.1
        with:
          version: 2.120.0
      - name: Prepare CI-only schema prerequisites
        run: cp supabase/ci/bootstrap_organizations.sql supabase/migrations/20261009000000_ci_bootstrap_organizations.sql
      - name: Start isolated local Supabase stack (Studio and postgres-meta included)
        run: supabase start --exclude imgproxy,logflare,vector,supavisor
      - name: Run SQL Editor package verification
        run: |
          supabase status -o env > "$RUNNER_TEMP/st.env"
          set -a; . "$RUNNER_TEMP/st.env"; set +a
          echo "::add-mask::${SERVICE_ROLE_KEY:-none}"
          rm -f "$RUNNER_TEMP/st.env"
          API_URL="$API_URL" STUDIO_URL="$STUDIO_URL" SERVICE_ROLE_KEY="$SERVICE_ROLE_KEY" python3 supabase/inspection/d04c4/ci/editor_path.py
      - name: Shut down isolated stack
        if: always()
        run: supabase stop --no-backup
